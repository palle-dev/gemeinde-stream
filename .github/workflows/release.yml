name: Signiertes Desktop-Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag und Paketversion prüfen
        run: |
          package_version=$(node -p "require('./apps/desktop/package.json').version")
          test "$GITHUB_REF_NAME" = "v$package_version"

  windows:
    needs: validate-version
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_SIGNING_ENABLED: ${{ secrets.WINDOWS_CERTIFICATE != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Abhängigkeiten auf bekannte Schwachstellen prüfen
        run: npm audit --audit-level=high
      - name: Windows-Signaturkonfiguration prüfen
        shell: pwsh
        run: |
          if ($env:WINDOWS_SIGNING_ENABLED -ne "true") {
            Write-Warning "Windows-Code-Signing-Secrets fehlen; Installer wird unsigniert als Vorab-Release gebaut."
          }
      - name: Prüfen und Windows-Installer bauen
        run: |
          npm run typecheck
          npm test
          npm run stream:smoke
          npm run dist:win
          npm run dist:meeting:win
      - name: Windows-Code-Signatur verifizieren
        shell: pwsh
        run: |
          $installers = Get-ChildItem "apps/desktop/release/*.exe", "apps/desktop/release-meeting/*.exe"
          if ($installers.Count -eq 0) { throw "Kein Windows-Installer gefunden." }
          if ($env:WINDOWS_SIGNING_ENABLED -ne "true") {
            Write-Warning "Signaturprüfung übersprungen: unsigniertes Vorab-Release."
            exit 0
          }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne "Valid") {
              throw "Ungültige Signatur für $($installer.Name): $($signature.Status)"
            }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release-meeting/*.exe
          if-no-files-found: error

  macos:
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
            file_arch: x86_64
          - runner: macos-15
            arch: arm64
            file_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      MACOS_SIGNING_ENABLED: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' }}
      MACOS_NOTARIZATION_ENABLED: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Abhängigkeiten auf bekannte Schwachstellen prüfen
        run: npm audit --audit-level=high
      - name: Signaturkonfiguration prüfen
        run: |
          if [ "$MACOS_SIGNING_ENABLED" != "true" ]; then
            echo "::warning::macOS-Code-Signing-Secrets fehlen; Pakete werden unsigniert als Vorab-Release gebaut."
          elif [ "$MACOS_NOTARIZATION_ENABLED" != "true" ]; then
            echo "::warning::Apple-Notarisierungsdaten fehlen; Pakete werden ohne Notarisierung als Vorab-Release gebaut."
          fi
      - name: Prüfen, signieren und notarisiertes macOS-Paket bauen
        run: |
          if [ "$MACOS_SIGNING_ENABLED" != "true" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          elif [ "$MACOS_NOTARIZATION_ENABLED" != "true" ]; then
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          npm run typecheck
          npm test
          npm run stream:smoke
          npm run dist:mac
          npm run dist:meeting:mac
      - name: Code-Signatur und Notarisierung verifizieren
        run: |
          if [ "$MACOS_SIGNING_ENABLED" != "true" ]; then
            echo "::warning::Signatur- und Notarisierungsprüfung übersprungen: unsigniertes Vorab-Release."
            exit 0
          fi
          studio_bundle=$(find apps/desktop/release -name 'Gemeinde Stream.app' -type d | head -1)
          meeting_bundle=$(find apps/desktop/release-meeting -name 'Gemeinde Meeting.app' -type d | head -1)
          test -n "$studio_bundle"
          test -n "$meeting_bundle"
          for app_bundle in "$studio_bundle" "$meeting_bundle"; do
            codesign --verify --deep --strict --verbose=2 "$app_bundle"
            if [ "$MACOS_NOTARIZATION_ENABLED" = "true" ]; then
              spctl --assess --type execute --verbose=2 "$app_bundle"
              xcrun stapler validate "$app_bundle"
            fi
          done
          if [ "$MACOS_NOTARIZATION_ENABLED" = "true" ]; then
            for package in apps/desktop/release/*.dmg apps/desktop/release-meeting/*.dmg; do
              xcrun stapler validate "$package"
            done
          fi
      - name: macOS-Pakete, Bundle und Architektur prüfen
        run: |
          app_bundle=$(find apps/desktop/release -name 'Gemeinde Stream.app' -type d | head -1)
          meeting_bundle=$(find apps/desktop/release-meeting -name 'Gemeinde Meeting.app' -type d | head -1)
          app_binary=$(find apps/desktop/release -path '*/Gemeinde Stream.app/Contents/MacOS/Gemeinde Stream' -type f | head -1)
          meeting_binary=$(find apps/desktop/release-meeting -path '*/Gemeinde Meeting.app/Contents/MacOS/Gemeinde Meeting' -type f | head -1)
          ffmpeg_binary=$(find apps/desktop/release -path '*/app.asar.unpacked/node_modules/ffmpeg-static/ffmpeg' -type f | head -1)
          meeting_ffmpeg=$(find apps/desktop/release-meeting -path '*/app.asar.unpacked/node_modules/ffmpeg-static/ffmpeg' -type f | head -1)
          package_version=$(node -p "require('./apps/desktop/package.json').version")
          test -n "$app_bundle"
          test -n "$meeting_bundle"
          test -n "$app_binary"
          test -n "$meeting_binary"
          test -n "$ffmpeg_binary"
          test -n "$meeting_ffmpeg"
          test -x "$app_binary"
          test -x "$meeting_binary"
          test -x "$ffmpeg_binary"
          test -x "$meeting_ffmpeg"
          file "$app_binary" | grep '${{ matrix.file_arch }}'
          file "$meeting_binary" | grep '${{ matrix.file_arch }}'
          file "$ffmpeg_binary" | grep '${{ matrix.file_arch }}'
          file "$meeting_ffmpeg" | grep '${{ matrix.file_arch }}'
          test "$(plutil -extract CFBundleIdentifier raw "$app_bundle/Contents/Info.plist")" = "de.gemeinde.stream"
          test "$(plutil -extract CFBundleIdentifier raw "$meeting_bundle/Contents/Info.plist")" = "de.gemeinde.meeting"
          test "$(plutil -extract CFBundleShortVersionString raw "$app_bundle/Contents/Info.plist")" = "$package_version"
          test "$(plutil -extract CFBundleShortVersionString raw "$meeting_bundle/Contents/Info.plist")" = "$package_version"
          for package in apps/desktop/release/*.dmg apps/desktop/release-meeting/*.dmg; do
            hdiutil verify -quiet "$package"
          done
          for package in apps/desktop/release/*.zip apps/desktop/release-meeting/*.zip; do
            unzip -tqq "$package"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release-meeting/*.dmg
            apps/desktop/release-meeting/*.zip
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-downloads
      - name: Release-Dateien zusammenführen
        run: |
          mkdir release-assets
          while IFS= read -r -d '' package; do
            target="release-assets/$(basename "$package")"
            if [ -e "$target" ]; then
              echo "Doppelter Release-Dateiname: $target" >&2
              exit 1
            fi
            cp "$package" "$target"
          done < <(find release-downloads -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) -print0)
          test "$(find release-assets -type f | wc -l)" -eq 10
      - name: Prüfsummen erzeugen
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - name: GitHub-Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --generate-notes \
            --prerelease \
            --title "Gemeinde Stream $GITHUB_REF_NAME"
