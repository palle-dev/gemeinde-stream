name: Signiertes Desktop-Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag und Paketversion prüfen
        run: |
          package_version=$(node -p "require('./apps/desktop/package.json').version")
          test "$GITHUB_REF_NAME" = "v$package_version"

  windows:
    needs: validate-version
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Windows-Signaturkonfiguration prüfen
        shell: pwsh
        run: |
          if (-not $env:CSC_LINK -or -not $env:CSC_KEY_PASSWORD) { throw "Windows-Code-Signing-Secrets fehlen." }
      - name: Prüfen und Windows-Installer bauen
        run: |
          npm run typecheck
          npm test
          npm run stream:smoke
          npm run dist:win
      - name: Windows-Code-Signatur verifizieren
        shell: pwsh
        run: |
          $installers = Get-ChildItem "apps/desktop/release/*.exe"
          if ($installers.Count -eq 0) { throw "Kein Windows-Installer gefunden." }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne "Valid") {
              throw "Ungültige Signatur für $($installer.Name): $($signature.Status)"
            }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: apps/desktop/release/*.exe
          if-no-files-found: error

  macos:
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
            file_arch: x86_64
          - runner: macos-15
            arch: arm64
            file_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Signaturkonfiguration prüfen
        run: |
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"
      - name: Prüfen, signieren und notarisiertes macOS-Paket bauen
        run: |
          npm run typecheck
          npm test
          npm run stream:smoke
          npm run dist:mac
      - name: Code-Signatur und Notarisierung verifizieren
        run: |
          app_bundle=$(find apps/desktop/release -name 'Gemeinde Stream.app' -type d | head -1)
          test -n "$app_bundle"
          codesign --verify --deep --strict --verbose=2 "$app_bundle"
          spctl --assess --type execute --verbose=2 "$app_bundle"
          xcrun stapler validate "$app_bundle"
          for package in apps/desktop/release/*.dmg; do
            xcrun stapler validate "$package"
          done
      - name: macOS-Pakete, Bundle und Architektur prüfen
        run: |
          app_bundle=$(find apps/desktop/release -name 'Gemeinde Stream.app' -type d | head -1)
          app_binary=$(find apps/desktop/release -path '*/Gemeinde Stream.app/Contents/MacOS/Gemeinde Stream' -type f | head -1)
          ffmpeg_binary=$(find apps/desktop/release -path '*/app.asar.unpacked/node_modules/ffmpeg-static/ffmpeg' -type f | head -1)
          package_version=$(node -p "require('./apps/desktop/package.json').version")
          test -n "$app_bundle"
          test -n "$app_binary"
          test -n "$ffmpeg_binary"
          test -x "$app_binary"
          test -x "$ffmpeg_binary"
          file "$app_binary" | grep '${{ matrix.file_arch }}'
          file "$ffmpeg_binary" | grep '${{ matrix.file_arch }}'
          test "$(plutil -extract CFBundleIdentifier raw "$app_bundle/Contents/Info.plist")" = "de.gemeinde.stream"
          test "$(plutil -extract CFBundleShortVersionString raw "$app_bundle/Contents/Info.plist")" = "$package_version"
          for package in apps/desktop/release/*.dmg; do
            hdiutil verify -quiet "$package"
          done
          for package in apps/desktop/release/*.zip; do
            unzip -tqq "$package"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Prüfsummen erzeugen
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - name: GitHub-Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes --title "Gemeinde Stream $GITHUB_REF_NAME"
