name: Prüfung und Windows-Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Typen prüfen
        run: npm run typecheck

      - name: Tests ausführen
        run: npm test

      - name: Windows-Installer bauen
        run: npm run dist:win

      - name: Installer als Build-Artefakt speichern
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: gemeinde-stream-windows
          path: apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14

