name: Desktop-Prüfung und Plattform-Builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v7
      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Abhängigkeiten auf bekannte Schwachstellen prüfen
        run: npm audit --audit-level=high
      - name: Typen prüfen
        run: npm run typecheck
      - name: Tests ausführen
        run: npm test
      - name: Lokale RTMP-Ausspielung prüfen
        run: npm run stream:smoke
      - name: Desktop-Anwendung bauen
        run: npm run build

  package-macos:
    needs: verify-macos
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
            file_arch: x86_64
          - runner: macos-15
            arch: arm64
            file_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Abhängigkeiten auf bekannte Schwachstellen prüfen
        run: npm audit --audit-level=high
      - name: Native macOS-Pakete bauen
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac
      - name: macOS-Pakete und Bundle prüfen
        run: |
          app_bundle=$(find apps/desktop/release -name 'Gemeinde Stream.app' -type d | head -1)
          app_binary=$(find apps/desktop/release -path '*/Gemeinde Stream.app/Contents/MacOS/Gemeinde Stream' -type f | head -1)
          ffmpeg_binary=$(find apps/desktop/release -path '*/app.asar.unpacked/node_modules/ffmpeg-static/ffmpeg' -type f | head -1)
          package_version=$(node -p "require('./apps/desktop/package.json').version")
          test -n "$app_bundle"
          test -n "$app_binary"
          test -n "$ffmpeg_binary"
          test -x "$app_binary"
          test -x "$ffmpeg_binary"
          file "$app_binary" | grep '${{ matrix.file_arch }}'
          file "$ffmpeg_binary" | grep '${{ matrix.file_arch }}'
          test "$(plutil -extract CFBundleIdentifier raw "$app_bundle/Contents/Info.plist")" = "de.gemeinde.stream"
          test "$(plutil -extract CFBundleShortVersionString raw "$app_bundle/Contents/Info.plist")" = "$package_version"
          for package in apps/desktop/release/*.dmg; do
            hdiutil verify -quiet "$package"
          done
          for package in apps/desktop/release/*.zip; do
            unzip -tqq "$package"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: gemeinde-stream-macos-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
          if-no-files-found: error
          retention-days: 14

  verify-and-package:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Abhängigkeiten auf bekannte Schwachstellen prüfen
        run: npm audit --audit-level=high

      - name: Typen prüfen
        run: npm run typecheck

      - name: Tests ausführen
        run: npm test

      - name: Lokale RTMP-Ausspielung prüfen
        run: npm run stream:smoke

      - name: Windows-Installer bauen
        run: npm run dist:win

      - name: Installer als Build-Artefakt speichern
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: gemeinde-stream-windows
          path: apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14

