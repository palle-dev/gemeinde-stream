appId: de.gemeinde.meeting
productName: Gemeinde Meeting
icon: build/icon.png
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
protocols:
  - name: Gemeinde Meeting Einladung
    schemes:
      - gemeinde-meeting
directories:
  output: release-meeting
files:
  - out/**/*
  - package.json
asarUnpack:
  - node_modules/ffmpeg-static/ffmpeg
  - node_modules/ffmpeg-static/ffmpeg.exe
win:
  target: nsis
mac:
  target:
    - dmg
    - zip
  category: public.app-category.business
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: Gemeinde Meeting benötigt die Kamera für Videomeetings.
    NSMicrophoneUsageDescription: Gemeinde Meeting benötigt das Mikrofon für Videomeetings.
    NSScreenCaptureUsageDescription: Gemeinde Meeting benötigt die Bildschirmfreigabe für Präsentationen und Zusammenarbeit.
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
